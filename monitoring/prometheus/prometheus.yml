global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: log_ingestor
    metrics_path: /metrics
    static_configs:
      - targets:
          - log_ingestor:9898
