---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart netai backend
  ansible.builtin.systemd_service:
    name: netai-backend
    state: restarted

- name: Restart netai MCP servers
  ansible.builtin.systemd_service:
    name: netai-mcp-servers
    state: restarted

- name: Restart netai log ingestor
  ansible.builtin.systemd_service:
    name: netai-log-ingestor
    state: restarted
  when: netai_enable_log_ingestor | bool

- name: Restart netai log MCP
  ansible.builtin.systemd_service:
    name: netai-log-mcp
    state: restarted
  when: netai_enable_log_mcp | bool

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
