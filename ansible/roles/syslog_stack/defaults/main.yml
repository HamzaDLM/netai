---
# The syslog stack is deliberately one deployment unit: ClickHouse and Redis
# provide its state, while the two Rust binaries provide ingestion and MCP
# access. Individual switches remain useful for split-host deployments.
netai_syslog_stack_enabled: true
netai_clickhouse_enabled: true
netai_redis_enabled: true
netai_enable_log_ingestor: true
netai_enable_syslog_mcp: true
netai_restart_backend_with_syslog_mcp: true

# ClickHouse is installed from versioned Debian packages bundled with this role
# under files/. Keeping the packages with the deployment content makes
# installation independent from external package repositories.
netai_clickhouse_version: "26.3.17.110"
netai_clickhouse_architectures:
  x86_64: amd64
  aarch64: arm64
netai_clickhouse_arch: >-
  {{ netai_clickhouse_architectures.get(ansible_architecture, '') }}
netai_clickhouse_deb_packages:
  - >-
    {{ 'clickhouse-common-static_' ~ netai_clickhouse_version
       ~ '_' ~ netai_clickhouse_arch ~ '.deb' }}
  - >-
    {{ 'clickhouse-client_' ~ netai_clickhouse_version
       ~ '_' ~ netai_clickhouse_arch ~ '.deb' }}
  - >-
    {{ 'clickhouse-server_' ~ netai_clickhouse_version
       ~ '_' ~ netai_clickhouse_arch ~ '.deb' }}
# Optional expected SHA-256 values keyed by package filename. Ansible's copy
# module already checks transfer integrity when this mapping is empty.
netai_clickhouse_deb_sha256: {}
netai_clickhouse_cache_dir: /var/cache/netai
netai_clickhouse_config_dir: /etc/clickhouse-server
netai_clickhouse_data_dir: /var/lib/clickhouse
netai_clickhouse_log_dir: /var/log/clickhouse-server
netai_clickhouse_user_name: clickhouse
netai_clickhouse_group: clickhouse
netai_clickhouse_host: 127.0.0.1
netai_clickhouse_http_port: 8123
netai_clickhouse_native_port: 9000
netai_clickhouse_db: netops
netai_clickhouse_user: admin
netai_clickhouse_password: admin

# Redis remains distribution-managed, but its complete configuration and
# lifecycle live in this role with the rest of the syslog stack.
netai_redis_bind: 127.0.0.1
netai_redis_port: 6379
netai_redis_password: ""

netai_log_ingestor_cpu_quota: "100%"
netai_log_ingestor_memory_high: 768M
netai_log_ingestor_memory_max: 1G
netai_log_ingestor_tasks_max: 512
netai_syslog_mcp_cpu_quota: "50%"
netai_syslog_mcp_memory_high: 384M
netai_syslog_mcp_memory_max: 512M
netai_syslog_mcp_tasks_max: 256

netai_log_ingestor_env:
  RUST_LOG: info
  KAFKA_BROKERS: >-
    {{ netai_kafka_bootstrap_servers | default('127.0.0.1:9092') }}
  KAFKA_TOPIC: syslogs
  KAFKA_GROUP_ID: log-ingestor
  CLICKHOUSE_URL: >-
    http://{{ netai_clickhouse_host }}:{{ netai_clickhouse_http_port }}
  CLICKHOUSE_DB: "{{ netai_clickhouse_db }}"
  CLICKHOUSE_USER: "{{ netai_clickhouse_user }}"
  CLICKHOUSE_PASSWORD: "{{ netai_clickhouse_password }}"
  CLICKHOUSE_RETENTION_DAYS: "30"
  CLICKHOUSE_BATCH_SIZE: "1000"
  CLICKHOUSE_FLUSH_INTERVAL_MS: "100"
  CLICKHOUSE_INSERT_QUEUE_CAPACITY: "20000"
  CLICKHOUSE_INSERT_MAX_RETRIES: "5"
  CLICKHOUSE_INSERT_RETRY_BACKOFF_MS: "250"
  CLICKHOUSE_INSERT_TIMEOUT_SECS: "10"
  INGEST_MAX_IN_FLIGHT: "256"
  KAFKA_LAG_POLL_INTERVAL_SECS: "15"
  METRICS_BIND: 127.0.0.1:9898
  SYSLOG_MCP_BIND: 127.0.0.1:8010
  SYSLOG_MCP_ALLOWED_HOSTS: localhost,127.0.0.1
  SYSLOG_MCP_TOKEN: ""
  SYSLOG_QUERY_DEFAULT_WINDOW_SECS: "3600"
  SYSLOG_QUERY_MAX_WINDOW_SECS: "604800"
  SYSLOG_QUERY_MAX_RESULTS: "200"
  SYSLOG_QUERY_TIMEOUT_SECS: "8"
  IGNORED_SYSLOG_TEXTS: ""
  REDIS_URL: >-
    {{ netai_log_ingestor_redis_url | default(
       'redis://:' ~ (netai_redis_password | urlencode)
       ~ '@' ~ netai_redis_bind ~ ':' ~ netai_redis_port ~ '/'
       if netai_redis_password | length > 0
       else 'redis://' ~ netai_redis_bind ~ ':' ~ netai_redis_port ~ '/') }}
  VENDOR_LOOKUP_URL: ""
  VENDOR_REFRESH_SECS: "900"
  VENDOR_CACHE_PREFIX: vendor_cache
